[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-sonar"
version = "0.1.0"
description = "Generate static Tech Sonar content from GitHub issues"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<1",
]

[project.scripts]
tech-sonar = "tech_sonar.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["*_tests.py"]
