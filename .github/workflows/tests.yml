name: Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
          skipPush: true
      - name: Install devenv 2.3.1
        run: >-
          nix profile add
          github:NixOS/nixpkgs/4c56f4ab3a09646f27c7c126a77befbf61df6977#devenv
      - run: devenv test
