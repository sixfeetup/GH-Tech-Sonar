name: Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest
      - name: Verify packaged resources
        run: |
          uv build --out-dir "$RUNNER_TEMP/dist"
          WHEEL="$(find "$RUNNER_TEMP/dist" -name '*.whl' -print -quit)" \
            python3 - <<'PY'
          import os
          import zipfile

          required = {
              "tech_sonar/issue_templates/technology.yml",
              "tech_sonar/web/index.html",
              "tech_sonar/web/package.json",
              "tech_sonar/web/package-lock.json",
              "tech_sonar/web/src/main.tsx",
              "tech_sonar/web/vite.config.ts",
          }
          with zipfile.ZipFile(os.environ["WHEEL"]) as wheel:
              missing = required.difference(wheel.namelist())
          if missing:
              raise SystemExit(f"wheel is missing resources: {sorted(missing)}")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
