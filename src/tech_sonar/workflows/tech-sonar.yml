name: Tech Sonar

on:
  workflow_dispatch:
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - closed
      - reopened
      - labeled
      - unlabeled
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed

concurrency:
  group: tech-sonar-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  update-tech-sonar:
    runs-on: ubuntu-latest
    env:
      TECH_SONAR_PACKAGE: >-
        tech-sonar @ git+https://github.com/sixfeetup/GH-Tech-Sonar.git@__TECH_SONAR_REVISION__
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Tech Sonar data
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="$(
            uv run \
              --with "$TECH_SONAR_PACKAGE" \
              tech-sonar generate
          )"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Build and publish Tech Sonar
        env:
          PUBLISH_ARGS: ${{ vars.PUBLISH_ARGS }}
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
        run: |
          uv run \
            --with "$TECH_SONAR_PACKAGE" \
            tech-sonar publish "${{ steps.generate.outputs.artifact }}" \
              --output "$RUNNER_TEMP/tech-sonar-site" \
              --args "$PUBLISH_ARGS"
      - name: Upload assembled site for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tech-sonar-site
          path: ${{ runner.temp }}/tech-sonar-site
          retention-days: 1
