name: Tech Sonar

on:
  workflow_dispatch:
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - closed
      - reopened
      - labeled
      - unlabeled
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed

concurrency:
  group: tech-sonar-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Generate Tech Sonar data
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tech_sonar_url="git+https://github.com/sixfeetup/GH-Tech-Sonar.git"
          artifact="$(
            uv run \
              --with "tech-sonar @ ${tech_sonar_url}@__TECH_SONAR_REVISION__" \
              tech-sonar generate
          )"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Upload generated data for debugging
        uses: actions/upload-artifact@v4
        with:
          name: tech-sonar-json
          path: ${{ steps.generate.outputs.artifact }}
          retention-days: 1
