name: 🔭 Technology
description: Propose or document a technology for Tech Sonar
labels:
  - SONAR EXPLORE
body:
  - type: markdown
    attributes:
      value: |
        Use the Labels sidebar to select one or more `SONAR CATEGORY …`
        labels. `SONAR EXPLORE` is selected by default; replace
        `SONAR EXPLORE` with another Sonar status when appropriate.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is this technology and what does it provide?
    validations:
      required: true
  - type: textarea
    id: suitable-projects
    attributes:
      label: Suitable projects
      description: >-
        What kinds of projects should use this technology? Be more specific
        than the selected categories, and include important constraints.
    validations:
      required: true
  - type: textarea
    id: required-skills
    attributes:
      label: Required skills
      description: What skills are needed to use and maintain this technology?
    validations:
      required: true
